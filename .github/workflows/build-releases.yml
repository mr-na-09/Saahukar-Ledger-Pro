name: Build Sahukar Ledger Pro Apps

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Windows installer
        run: npm run electron:build

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: Sahukar-Ledger-Pro-Windows
          path: release/Sahukar-Ledger-Pro-Setup-0.0.0.exe

  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm ci

      - name: Build web assets and sync Android
        run: npm run android:sync

      - name: Build Android APK
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleDebug

      - name: Rename Android APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk Sahukar-Ledger-Pro-Android.apk

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: Sahukar-Ledger-Pro-Android
          path: Sahukar-Ledger-Pro-Android.apk

  release:
    runs-on: ubuntu-latest
    needs: [build-windows, build-android]
    steps:
      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: Sahukar-Ledger-Pro-Windows
          path: release-files

      - name: Download Android artifact
        uses: actions/download-artifact@v4
        with:
          name: Sahukar-Ledger-Pro-Android
          path: release-files

      - name: Publish latest release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Sahukar Ledger Pro Latest
          prerelease: false
          make_latest: true
          files: release-files/*